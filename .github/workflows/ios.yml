name: iOS
on:
  push:
    branches: [ios]
    paths: ['ios/**', 'www/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Core tests
        run: swift test --package-path ios/QingkeCore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Qingke.xcodeproj -scheme Qingke -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build \
            | grep -E '(error|warning: .*Qingke|BUILD)' || true
          test -d build/sim/Build/Products/Debug-iphonesimulator/Qingke.app
      - name: Simulator screenshots
        run: |
          set -euo pipefail
          device=$(python3 ios/ci/pick-simulator.py)
          xcrun simctl list devices | grep "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$device" build/sim/Build/Products/Debug-iphonesimulator/Qingke.app
          mkdir -p screenshots
          shot() {
            xcrun simctl terminate "$device" cn.qingke.app >/dev/null 2>&1 || true
            SIMCTL_CHILD_QINGKE_DEMO_STATE_FILE="$PWD/ios/ci/demo-state.json" SIMCTL_CHILD_QINGKE_DEMO_SCRIPT="$2" \
              xcrun simctl launch "$device" cn.qingke.app >/dev/null
            sleep "${3:-8}"
            xcrun simctl io "$device" screenshot "screenshots/$1.png"
          }
          shot 1-timetable "" 12
          shot 2-today "document.querySelector('[data-tab=\"today\"]').click()"
          shot 3-settings "document.querySelector('[data-tab=\"settings\"]').click()"
          shot 4-reminders "document.querySelector('[data-tab=\"settings\"]').click();setTimeout(function(){document.querySelector('[data-action=\"notifications\"]').click()},400)"
          shot 5-course "document.querySelector('.course-block').click()"
          xcrun simctl spawn "$device" log show --last 5m --style compact --predicate 'eventMessage CONTAINS "[QingkeWeb]"' || true
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild -project ios/Qingke.xcodeproj -scheme Qingke -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | grep -E '(error|BUILD)' || true
          app=build/device/Build/Products/Release-iphoneos/Qingke.app
          test -d "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qry "qingke-$version-ios-unsigned.ipa" Payload
          shasum -a 256 qingke-*-ios-unsigned.ipa | tee SHA256SUMS-ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned-ipa
          path: |
            qingke-*-ios-unsigned.ipa
            SHA256SUMS-ios
