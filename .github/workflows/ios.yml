name: iOS
on:
  push:
    branches: [ios]
    paths: ['ios/**', 'www/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        # The iOS 26 SDK is what gives the system tab bar its Liquid Glass look.
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
      - name: Core tests
        run: swift test --package-path ios/QingkeCore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Qingke.xcodeproj -scheme Qingke -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build \
            | grep -E '(error|warning: .*Qingke|BUILD)' || true
          test -d build/sim/Build/Products/Debug-iphonesimulator/Qingke.app
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild -project ios/Qingke.xcodeproj -scheme Qingke -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | grep -E '(error|BUILD)' || true
          app=build/device/Build/Products/Release-iphoneos/Qingke.app
          test -d "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qry "qingke-$version-ios-unsigned.ipa" Payload
          shasum -a 256 qingke-*-ios-unsigned.ipa | tee SHA256SUMS-ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned-ipa
          path: |
            qingke-*-ios-unsigned.ipa
            SHA256SUMS-ios
      - name: Simulator screenshots
        # Screenshots are a preview aid; a slow simulator must never block the IPA.
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -euo pipefail
          device=$(python3 ios/ci/pick-simulator.py)
          xcrun simctl list devices | grep "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          sleep 20
          xcrun simctl status_bar "$device" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$device" build/sim/Build/Products/Debug-iphonesimulator/Qingke.app
          mkdir -p screenshots
          shot() {
            xcrun simctl terminate "$device" cn.qingke.app >/dev/null 2>&1 || true
            SIMCTL_CHILD_QINGKE_DEMO_STATE_FILE="$PWD/ios/ci/demo-state.json" SIMCTL_CHILD_QINGKE_DEMO_SCRIPT="$2" \
              xcrun simctl launch "$device" cn.qingke.app >/dev/null
            sleep "${3:-8}"
            xcrun simctl io "$device" screenshot "screenshots/$1.png"
          }
          # The first launch spins up the web content process and can capture a blank page.
          shot 0-warmup "" 15 && rm -f screenshots/0-warmup.png
          shot 1-timetable "" 10
          shot 1b-timetable-scrolled "window.scrollTo(0,420)"
          shot 2-today "window.onNativeTab('today')"
          shot 3-settings "window.onNativeTab('settings')"
          shot 3b-settings-scrolled "window.onNativeTab('settings');setTimeout(function(){window.scrollTo(0,260)},400)"
          shot 4-reminders "window.onNativeTab('settings');setTimeout(function(){document.querySelector('[data-action=\"notifications\"]').click()},400)"
          shot 5-course "document.querySelector('.course-block').click()"
          xcrun simctl spawn "$device" log show --last 5m --style compact --predicate 'eventMessage CONTAINS "[QingkeWeb]"' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: ignore
  release:
    # Separate job: the write token never shares a runner with brew packages or the Xcode build.
    needs: build
    if: github.ref == 'refs/heads/ios'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-unsigned-ipa
      - name: Attach IPA to the release
        # The release of the same version (v3.3.5 for MARKETING_VERSION 3.3.5, and so on) carries the latest iOS build.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ipa=$(ls qingke-*-ios-unsigned.ipa)
          version=${ipa#qingke-}; version=${version%-ios-unsigned.ipa}
          sha256sum -c SHA256SUMS-ios
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$ipa" SHA256SUMS-ios --clobber
          else
            echo "::warning::release v$version does not exist yet; IPA left as a workflow artifact"
          fi
