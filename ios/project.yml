# Generate with `xcodegen generate --spec ios/project.yml` (CI does this on a macOS runner).
name: Qingke
options:
  bundleIdPrefix: cn.qingke
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  QingkeCore:
    path: QingkeCore
settings:
  base:
    # Kept equal to android/app/build.gradle by tests/version.test.mjs.
    MARKETING_VERSION: 3.3.3
    CURRENT_PROJECT_VERSION: 10
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Qingke:
    type: application
    platform: iOS
    sources:
      - path: Qingke
        excludes:
          - Info.plist
      - path: ../www
        type: folder
        buildPhase: resources
    dependencies:
      - package: QingkeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.qingke.app
        PRODUCT_NAME: Qingke
        INFOPLIST_FILE: Qingke/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  Qingke:
    build:
      targets:
        Qingke: all
    run:
      config: Debug
    archive:
      config: Release
